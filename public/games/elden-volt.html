<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Elden Volt - Tesla Souls Prototype</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.js"></script>
    <style>body { margin:0; background:#000; }</style>
</head>
<body style="margin:0;background:#000;color:#ddd;font-family:system-ui">
<div style="position:fixed;top:12px;left:16px;z-index:100;font-size:13px;opacity:0.8">
  <a href="/" style="color:#e8a54b;text-decoration:none">← back to portfolio</a>
  &nbsp;·&nbsp; <span style="color:#ffaa00">ELDEN VOLT</span> <span style="opacity:0.5">(prototype)</span>
</div>
<script>
const config = {
    type: Phaser.AUTO,
    width: 1280,
    height: 720,
    physics: { default: 'arcade', arcade: { debug: false } },
    scene: { preload, create, update }
};

const game = new Phaser.Game(config);

let player, enemy, cursors, attackKey, rollKey;
let playerHP = 100, enemyHP = 80, stamina = 100;
let isRolling = false, canAttack = true;
let healthText, staminaText, statusText;

function preload() {
    // No external assets needed for prototype
}

function create() {
    // Dark foggy arena
    this.add.rectangle(640, 360, 1280, 720, 0x0a0a0a);
    this.add.text(20, 20, 'ELDEN VOLT - Tesla Prototype', { fontSize: '24px', color: '#ffaa00' });

    // Player (Tarnished knight - blue rectangle)
    player = this.physics.add.sprite(400, 360, null).setSize(32, 32);
    player.setTint(0x4488ff);
    player.body.setCollideWorldBounds(true);
    player.hp = playerHP;

    // Enemy (Demigod machine - red)
    enemy = this.physics.add.sprite(800, 360, null).setSize(40, 40);
    enemy.setTint(0xff4444);
    enemy.hp = enemyHP;
    enemy.setImmovable(true);

    // Controls
    cursors = this.input.keyboard.createCursorKeys();
    this.input.keyboard.addKeys('W,S,A,D');
    attackKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);
    rollKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SHIFT);

    // UI
    healthText = this.add.text(20, 650, `HP: ${player.hp}`, { fontSize: '28px', color: '#ff0000' });
    staminaText = this.add.text(20, 680, `Stamina: ${stamina}`, { fontSize: '28px', color: '#00ff00' });
    statusText = this.add.text(500, 300, '', { fontSize: '48px', color: '#ffff00' }).setOrigin(0.5);
}

function update() {
    if (!player || !enemy) return;

    const speed = isRolling ? 400 : 200;
    player.setVelocity(0);

    // Movement (WASD + arrows)
    if (cursors.left.isDown || this.input.keyboard.addKey('A').isDown) player.setVelocityX(-speed);
    if (cursors.right.isDown || this.input.keyboard.addKey('D').isDown) player.setVelocityX(speed);
    if (cursors.up.isDown || this.input.keyboard.addKey('W').isDown) player.setVelocityY(-speed);
    if (cursors.down.isDown || this.input.keyboard.addKey('S').isDown) player.setVelocityY(speed);

    // Roll (Shift) - 0.4s i-frames + stamina cost
    if (Phaser.Input.Keyboard.JustDown(rollKey) && stamina >= 25 && !isRolling) {
        isRolling = true;
        stamina -= 25;
        player.setTint(0x88ffff);
        this.time.delayedCall(400, () => { isRolling = false; player.clearTint(); });
    }

    // Attack (Space) - simple hitbox
    if (Phaser.Input.Keyboard.JustDown(attackKey) && canAttack && stamina >= 15) {
        canAttack = false;
        stamina -= 15;
        player.setTint(0xffff00);
        
        // Attack hitbox check
        if (Phaser.Math.Distance.Between(player.x, player.y, enemy.x, enemy.y) < 70) {
            enemy.hp -= 20;
            enemy.setTint(0xff0000);
            this.time.delayedCall(100, () => enemy.clearTint());
            if (enemy.hp <= 0) statusText.setText('VICTORY! Amp Rune Acquired').setColor('#00ff00');
        }
        
        this.time.delayedCall(300, () => { canAttack = true; player.clearTint(); });
    }

    // Enemy simple AI (chases player)
    if (enemy.hp > 0) {
        this.physics.moveToObject(enemy, player, 120);
        // Enemy attack
        if (Phaser.Math.Distance.Between(player.x, player.y, enemy.x, enemy.y) < 55 && !isRolling) {
            player.hp -= 0.5;
        }
    }

    // Stamina regen
    if (stamina < 100) stamina = Math.min(100, stamina + 0.3);

    // UI update
    healthText.setText(`HP: ${Math.max(0, Math.floor(player.hp))}`);
    staminaText.setText(`Stamina: ${Math.floor(stamina)}`);

    // Death check
    if (player.hp <= 0) {
        statusText.setText('YOU DIED').setColor('#ff0000');
        player.setTint(0x000000);
        this.physics.pause();
    }
}
</script>
</body>
</html>
